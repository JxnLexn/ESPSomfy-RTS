[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Custom 4 MB partition scheme: two 1.5 MiB OTA slots and 896 KiB LittleFS.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 1572864

; Required libraries
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.1

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -fno-exceptions
    -fno-threadsafe-statics

; PlatformIO detects the serial port automatically. Set upload_port and
; monitor_port locally only if more than one compatible device is connected.
